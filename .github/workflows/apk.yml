# Builds Dexter's APK on GitHub's servers and publishes it as the "dexter-ultima" release, so the
# latest version can be downloaded and installed straight from the phone:
# https://github.com/emalvarez3-maker/ancla-habitos/releases/download/dexter-ultima/dexter.apk
#
# To install it over the version already on the phone (keeping its data), the APK has to be
# signed with the same key: add your PC's ~/.android/debug.keystore as the repository secret
# DEBUG_KEYSTORE_BASE64 (base64 of the file). Without it, GitHub signs with its own throwaway key.
name: APK

on:
  push:
    branches: [ancla/automaticidad]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the phone's signing key, if provided
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "SIGNING=same key as your PC" >> "$GITHUB_ENV"
          else
            echo "SIGNING=GitHub's own key (uninstall the old app first, or add DEBUG_KEYSTORE_BASE64)" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: ./gradlew --no-daemon --stacktrace :uhabits-android:assembleDebug

      - name: Collect the APK
        run: |
          apk=$(find uhabits-android/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" dexter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dexter-apk
          path: dexter.apk

      - name: Publish as the "dexter-ultima" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The old "ancla-ultima" release (before the app was renamed) goes too.
          gh release delete ancla-ultima --yes --cleanup-tag || true
          gh release delete dexter-ultima --yes --cleanup-tag || true
          gh release create dexter-ultima dexter.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Dexter (última versión)" \
            --notes "Compilado de ${GITHUB_SHA::7} en la rama ${GITHUB_REF_NAME}. Firma: ${SIGNING}. En el celular: abre este enlace, descarga dexter.apk y ábrelo para instalar."
