# Installs Dexter on an Android emulator and tests it there: the JVM unit tests of Ancla's code,
# then DexterDeviceTest on the device (Keystore encryption, every screen opening, spoken
# reminders, quiet mode, the microphone listener). Screenshots of every screen, the test report
# and the device log are kept as the "dexter-device-test" artifact.
name: Device tests

on:
  push:
    branches: [ancla/automaticidad]
  workflow_dispatch:

concurrency:
  group: device-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (JVM)
        run: ./gradlew --no-daemon :uhabits-android:testDebugUnitTest --tests 'org.isoron.uhabits.ancla.*'

      # Logs need a GitHub sign-in; annotations don't: each failing test shows up on the run's page.
      - name: Show failing unit tests
        if: failure()
        run: |
          for f in uhabits-android/build/test-results/testDebugUnitTest/*.xml; do
            grep -q '<failure\|<error' "$f" || continue
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for bad in list(case.findall("failure")) + list(case.findall("error")):
                  msg = (bad.get("message") or bad.text or "").strip().splitlines()
                  first = msg[0][:300] if msg else ""
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{first}")
          PY
          done

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install on an emulator and test there
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -c || true
            ./gradlew --no-daemon :uhabits-android:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=org.isoron.uhabits.ancla.DexterDeviceTest,org.isoron.uhabits.ancla.DatabaseEncryptionTest || touch device-tests-failed
            mkdir -p device-output && adb pull /sdcard/Android/data/ec.ancla.habitos/files/dexter-screens device-output/ || true
            adb logcat -d > device-output/logcat.txt || true
            if grep -n "FATAL EXCEPTION" -A 30 device-output/logcat.txt; then touch device-tests-failed; fi
            find uhabits-android/build/outputs/androidTest-results -name '*.xml' -exec grep -h -A25 '<failure' {} + || true
            grep -n -A40 'AndroidRuntime\|FATAL EXCEPTION\|Process crashed' device-output/logcat.txt | head -300 || true
            grep -n 'DatabaseCipher\|AnclaCrypto\|DexterDeviceTest\|TestRunner' device-output/logcat.txt | head -200 || true
            test ! -f device-tests-failed

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dexter-device-test
          path: |
            device-output
            uhabits-android/build/reports/androidTests
            uhabits-android/build/reports/tests
